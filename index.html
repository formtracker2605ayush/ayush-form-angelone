<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ANGEL ONE WEB | Form Tracker</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 0, 150, 0.35), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(100, 0, 255, 0.35), transparent 35%),
        linear-gradient(135deg, #19002e, #4b075f, #17002c);
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 28px;
      padding: 32px 25px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #ff1493, #8a2be2, #ff1493);
    }

    .badge {
      display: inline-block;
      padding: 8px 15px;
      border-radius: 30px;
      background: linear-gradient(135deg, #ffe4f3, #eee2ff);
      color: #8a168d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 30px;
      color: #261033;
      margin-bottom: 8px;
    }

    .welcome {
      font-size: 18px;
      font-weight: 700;
      color: #8a168d;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 17px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #3d3044;
      margin-bottom: 7px;
    }
